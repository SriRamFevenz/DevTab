name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        run: npm test

      - name: Validate manifest.json
        run: npm run validate

      - name: Check tag matches manifest version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$version" >&2
            exit 1
          fi

      - name: Build extension zip
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp manifest.json newtab.html LICENSE README.md dist/
          cp -R css js icons dist/
          (cd dist && zip -r "../devtab-$GITHUB_REF_NAME.zip" .)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "devtab-$GITHUB_REF_NAME.zip" \
            --title "DevTab $GITHUB_REF_NAME" \
            --generate-notes
